name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole job takes seconds; an agent that ignores its abort signal must not hold a runner for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:types
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-report-node${{ matrix.node }}
          path: reports/eval-report.json
      # The regressed agent must trip the gate: exactly exit 1. Exit 0 means the gate
      # missed the leak; exit 2 means the run itself broke.
      - name: regression gate exits 1
        run: |
          set +e
          npm run eval:regression
          code=$?
          test $code -eq 1

  # The composite action, run from this checkout against the healthy sticker-shop agent.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./
        with:
          scenarios: examples/sticker-shop/scenarios.json
          agent: examples/sticker-shop/agent.js
      # The regressed agent must fail the step. Each step has its own summary file, so the
      # summary text itself is covered by test/action.test.js; this proves the exit code
      # reaches the runner.
      - uses: ./
        id: regressed
        continue-on-error: true
        with:
          scenarios: examples/sticker-shop/scenarios.json
          agent: examples/sticker-shop/regressed-agent.js
      - name: the action fails on the regressed agent
        if: steps.regressed.outcome != 'failure'
        run: |
          echo "the action did not fail on the regressed agent"
          exit 1
