name: Bug report
description: Something the harness does that it should not, or fails to do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use invented data only: no real customer messages, replies or API keys.
        For a security problem, do not open an issue; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag or a commit SHA.
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: node bin/eval.js -s scenarios.json -a agent.js --trials 3
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, including the exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario that reproduces it
      description: The smallest scenario (and agent reply) that shows the problem, with invented data.
      render: json
    validations:
      required: true
